services:
  postgres:
    image: postgres:16-alpine
    container_name: business-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: business_os
      POSTGRES_PASSWORD: business_os_dev_password
      POSTGRES_DB: business_os
    ports:
      - "5432:5432"
    volumes:
      - business_os_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_os -d business_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: business-os-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@business-os.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  business_os_pg_data:
